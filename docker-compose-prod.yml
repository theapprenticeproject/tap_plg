version: '3.8'

services:
  # ===================================
  # POSTGRESQL - Database
  # ===================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: plg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      POSTGRES_MAX_CONNECTIONS: 20
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - plg-network
    restart: unless-stopped

  # ===================================
  # PLAGIARISM CHECKER SERVICE
  # ===================================
  plagiarism-checker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plg-checker
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: journald
      options:
        tag: "plg-checker"
    deploy:
      resources:
        limits:
          cpus: '8.0'  # Increased from 4.0 - allows up to 8 CPU cores
          memory: 8G
        reservations:
          cpus: '2'    # Increased from 1 - guarantees 2 cores minimum
          memory: 2G
    restart: unless-stopped
    networks:
      - plg-network

  # ===================================
  # API SERVICE
  # ===================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: plg-api
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: journald
      options:
        tag: "plg-api"
    deploy:
      resources:
        limits:
          cpus: '8.0'  # Increased from 4.0 - allows up to 8 CPU cores
          memory: 8G
        reservations:
          cpus: '2'    # Increased from 1 - guarantees 2 cores minimum
          memory: 2G
    restart: unless-stopped
    networks:
      - plg-network


# ===================================
# VOLUMES
# ===================================
volumes:
  postgres_data:
    driver: local

# ===================================
# NETWORKS
# ===================================
networks:
  plg-network:
    driver: bridge
