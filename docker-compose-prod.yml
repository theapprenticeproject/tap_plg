version: '3.8'

services:
  # ===================================
  # PLAGIARISM CHECKER SERVICE
  # ===================================
  plagiarism-checker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mentorme-plagiarism-checker
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 2G
    restart: unless-stopped
    networks:
      - mentorme-plagiarism-network

# ===================================
# NETWORKS
# ===================================
networks:
  mentorme-plagiarism-network:
    driver: bridge
