# /etc/google-cloud-ops-agent/config.yaml
# TAP PLG SERVER ONLY
#
# After editing, restart the agent:
#   sudo systemctl restart google-cloud-ops-agent

logging:
  receivers:

    # tap_plg writes structured JSON to /app/logs/tap_plg_structured.log
    # inside the container, mounted to ~/tap_plg/logs/ on the host.
    tap_plg_structured:
      type: files
      include_paths:
        - /home/*/tap_plg/logs/tap_plg_structured.log
      wildcard_refresh_interval: 30s

  processors:

    parse_tap_plg_json:
      type: parse_json

    promote_severity:
      type: modify_fields
      fields:
        logging.googleapis.com/severity:
          move_from: jsonPayload.severity
        time:
          move_from: jsonPayload.timestamp

  service:
    pipelines:
      tap_plg_pipeline:
        receivers: [tap_plg_structured]
        processors: [parse_tap_plg_json, promote_severity]
