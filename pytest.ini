[pytest]
# Pytest configuration for MentorMe plagiarism detection system

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version requirement
minversion = 7.0

# Test paths
testpaths = tests

# Add current directory to Python path
pythonpath = .

# Asyncio mode for async tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage options
addopts =
    --verbose
    --strict-markers
    --cov=image_worker
    --cov=database
    --cov=mq
    --cov=processors
    --cov=utils
    --cov=plag_checker
    --cov=config
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    -ra

# Markers for different test types
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database, message queue)
    slow: Slow running tests
    asyncio: Tests that use asyncio
    smoke: Smoke tests for critical functionality

# Ignore warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test output options
console_output_style = progress
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
